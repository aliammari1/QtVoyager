# Dependabot configuration.
# QtVoyager is a native Qt/C++ app (qmake/CMake) with no package-manager
# manifest, so the only ecosystem Dependabot can usefully track here is the
# GitHub Actions used by the workflows.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
